# Runs what the repo already asks a contributor to run, on every push and
# every pull request, so "npm test is green" stops being something someone
# has to remember.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 23+: the test suite is TypeScript run directly through
      # `node --test`, which needs the built-in type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # eslint, oxlint and knip. Knip is why an unused export fails here.
      - run: npm run lint

      - run: npm test

      # Last, because it is the slowest and the one least likely to be the
      # thing that broke.
      - run: npm run build

  # The cluster image. Only pre-theme and main publish; every other branch
  # just builds. Tag is the 12-char commit SHA — never :latest — because Argo
  # diffs tags and a moving tag gives it nothing to see.
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push' && (github.ref == 'refs/heads/pre-theme' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/pre-theme' || github.ref == 'refs/heads/main') }}
          tags: ghcr.io/aaarrrccc/richmond-walk-roulette:${{ steps.tag.outputs.tag }}
          build-args: WALK_TAG=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
