<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e7" />
    <meta name="color-scheme" content="light dark" />
    <title>walk.plvr.net</title>
    <meta
      name="description"
      content="pick a walking time in richmond, see how far it reaches, spin for a destination. on arc's cluster."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:title" content="walk roulette" />
    <meta
      property="og:description"
      content="pick a walking time, see how far it reaches, spin for a destination."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="walk.plvr.net" />
    <!--
      The share image is the real thing: contours 15, 30 and 45 minutes on foot
      from Monroe Park, straight out of public/reach. The path is root-relative
      because the repo does not know its own deploy domain; give og:image and
      og:url absolute URLs once it has one.
    -->
    <!--
      Both are rewritten per-spin by the Worker on /s, which is why they exist
      here at all: HTMLRewriter can only rewrite an element that is already in
      the document, and inserting one is a different and more fragile job.

      The canonical carries NO href. Vite treats link[href] as an asset
      reference and tries to read "/" off disk, which is a directory - so the
      build fails outright rather than shipping a wrong value. A canonical with
      no href is ignored by crawlers, which is exactly right for a repo that
      does not know its own deploy domain; /s gets a real absolute one.
    -->
    <meta property="og:url" content="/" />
    <link rel="canonical" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="three nested walking-reach contours around a point in richmond."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
