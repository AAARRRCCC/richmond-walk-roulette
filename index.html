<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf7ee" />
    <title>Richmond Walk Roulette</title>
    <meta
      name="description"
      content="Spin a wheel for a random walking destination in downtown Richmond, Virginia."
    />

    <!-- Share-preview metadata. The Twitter card uses summary_large_image
         so the og:image is the dominant thumbnail in chats (iMessage,
         Discord, Slack). og:image is a static 1200x630 PNG of the wheel
         on the paper aesthetic — provide at /og-image.png in dist/. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Richmond Walk Roulette" />
    <meta
      property="og:description"
      content="Spin a wheel for a random walking destination in downtown Richmond, Virginia."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Richmond Walk Roulette" />
    <meta
      name="twitter:description"
      content="Spin a wheel for a random walking destination in downtown Richmond, Virginia."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
